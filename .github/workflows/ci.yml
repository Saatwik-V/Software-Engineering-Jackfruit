# Continuous Integration for the Jackfruit Huffman compressor.
#
# What this does, in order:
#   1. Builds the project with both GCC (g++) and Clang (clang++).
#   2. Compiles with -Wall -Wextra -Werror, so any compiler warning fails the build.
#   3. Runs every GoogleTest through CTest; a failing test fails the job.
#
# When it runs:
#   - on every pull request, and
#   - on every push to main (i.e. after a merge).
#
# To make "green CI" mandatory before merging, a repository admin must enable branch
# protection on `main` and mark both "Build & Test" jobs below as required checks
# (Settings -> Branches -> Branch protection rules). That is a repo setting, not a file.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older, now-outdated run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.compiler }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false   # let both compilers report even if one fails
      matrix:
        compiler: [g++, clang++]

    env:
      CXX: ${{ matrix.compiler }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install lcov (GCC coverage)
        if: matrix.compiler == 'g++'
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Configure CMake (Release with Coverage for GCC)
        run: |
          if [ "${{ matrix.compiler }}" = "g++" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror --coverage"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          fi

      - name: Build project
        run: cmake --build build --parallel

      - name: Run tests with CTest
        run: ctest --test-dir build --output-on-failure
      # Tests run sequentially on purpose: several existing tests share temp files/dirs
      # and are not safe to run in parallel (see PR discussion).

      - name: Generate Code Coverage Report (GCC)
        if: matrix.compiler == 'g++'
        run: |
          lcov --capture --directory build --base-directory . --output-file build/coverage.info --ignore-errors inconsistent,gcov,unused
          lcov --remove build/coverage.info '/usr/*' '*/tests/*' '*/_deps/*' --output-file build/coverage_filtered.info --ignore-errors unused,empty,inconsistent
          lcov --list build/coverage_filtered.info
          genhtml build/coverage_filtered.info --output-directory build/coverage_html --ignore-errors inconsistent,corrupt,empty

      - name: Upload HTML Coverage Artifact
        if: matrix.compiler == 'g++'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: build/coverage_html