# Continuous Integration for the Jackfruit Huffman compressor.
#
# What this does, in order:
#   1. Builds the project with both GCC (g++) and Clang (clang++).
#   2. Compiles with -Wall -Wextra -Werror, so any compiler warning fails the build.
#   3. Runs every GoogleTest through CTest; a failing test fails the job.
#
# When it runs:
#   - on every pull request, and
#   - on every push to main (i.e. after a merge).
#
# To make "green CI" mandatory before merging, a repository admin must enable branch
# protection on `main` and mark both "Build & Test" jobs below as required checks
# (Settings -> Branches -> Branch protection rules). That is a repo setting, not a file.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older, now-outdated run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.compiler }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false   # let both compilers report even if one fails
      matrix:
        compiler: [g++, clang++]

    env:
      CXX: ${{ matrix.compiler }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CMake (Release, warnings are errors)
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"

      - name: Build project
        run: cmake --build build --parallel

      - name: Run tests with CTest
        run: ctest --test-dir build --output-on-failure --parallel 4
