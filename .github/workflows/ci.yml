# Continuous Integration for the Jackfruit Huffman compressor.
#
# What this does, in order:
#   1. Builds the project with both GCC (g++) and Clang (clang++).
#   2. Compiles with -Wall -Wextra -Werror, so any compiler warning fails the build.
#   3. Runs every GoogleTest through CTest; a failing test fails the job.
#
# When it runs:
#   - on every pull request, and
#   - on every push to main (i.e. after a merge).
#
# To make "green CI" mandatory before merging, a repository admin must enable branch
# protection on `main` and mark both "Build & Test" jobs below as required checks
# (Settings -> Branches -> Branch protection rules). That is a repo setting, not a file.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older, now-outdated run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.compiler }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false   # let both compilers report even if one fails
      matrix:
        compiler: [g++, clang++]

    env:
      CXX: ${{ matrix.compiler }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install lcov (GCC coverage)
        if: matrix.compiler == 'g++'
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Configure CMake (Release with Coverage for GCC)
        run: |
          if [ "${{ matrix.compiler }}" = "g++" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror --coverage"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          fi

      - name: Build project
        run: cmake --build build --parallel

      - name: Run tests with CTest
        run: ctest --test-dir build --output-on-failure

      - name: Generate Code Coverage Report (GCC)
        if: matrix.compiler == 'g++'
        run: |
          lcov --capture --directory build --base-directory . --output-file build/coverage.info --ignore-errors inconsistent,gcov,unused
          lcov --remove build/coverage.info '/usr/*' '*/tests/*' '*/_deps/*' --output-file build/coverage_filtered.info --ignore-errors unused,empty,inconsistent
          lcov --list build/coverage_filtered.info
          genhtml build/coverage_filtered.info --output-directory build/coverage_html --ignore-errors inconsistent,corrupt,empty

      - name: Upload HTML Coverage Artifact
        if: matrix.compiler == 'g++'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: build/coverage_html

  sanitizer-checks:
    name: Security Sanitizers (ASan & UBSan)
    runs-on: ubuntu-latest
    env:
      CXX: clang++

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CMake with Sanitizers
        run: cmake -B build-sanitizers -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"

      - name: Build with Sanitizers
        run: cmake --build build-sanitizers --parallel

      - name: Run Tests with ASan & UBSan
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:abort_on_error=1"
        run: ctest --test-dir build-sanitizers --output-on-failure

  package-release:
    name: Package Release Artifact
    runs-on: ubuntu-latest
    needs: [build-and-test, sanitizer-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build release binary
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Assemble release package
        run: |
          mkdir -p release/jackfruit-v1.0
          cp build/jackfruit         release/jackfruit-v1.0/
          cp README.md               release/jackfruit-v1.0/
          cp -r docs/                release/jackfruit-v1.0/docs/
          cd release
          zip -r jackfruit-v1.0-linux-x86_64.zip jackfruit-v1.0/

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: jackfruit-v1.0-linux-x86_64
          path: release/jackfruit-v1.0-linux-x86_64.zip
          retention-days: 30